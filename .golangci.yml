# why-slow — golangci-lint configuration
# Configured for pure Go standard library, high-performance systems diagnostics, and zero-dependency invariants.

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment # performance alignment not strictly required on non-hot structs
      - shadow
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
  gosec:
    excludes:
      - G104 # unchecked errors (handled specifically by errcheck)
      - G304 # file path inclusion in ReadFile/Open (diagnostic tool reads kernel /proc paths)
      - G115 # integer overflow conversion (diagnostic counters are bounds-checked in logic)
  misspell:
    locale: US

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - govet
    - ineffassign
    - staticcheck
    - revive
    - misspell
    - gosec
    - unconvert

issues:
  exclude-dirs:
    - testdata
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - misspell

