name: 🐛 Bug Report
description: Report unexpected behavior, false positives, or errors in why-slow
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with `why-slow`!
        Please fill in the information below to help us reproduce and resolve the problem.
  - type: input
    id: version
    attributes:
      label: why-slow Version
      description: Run `why-slow --version` and paste the output here.
      placeholder: "e.g., why-slow version v0.26.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux Environment & Architecture
      description: Run `uname -a` and paste the output (kernel version, architecture).
      placeholder: "e.g., Linux 6.8.0-40-generic x86_64 Ubuntu 24.04 LTS"
    validations:
      required: true
  - type: dropdown
    id: privilege
    attributes:
      label: Execution Privilege Level
      description: How was why-slow invoked?
      options:
        - "Unprivileged (regular user)"
        - "Elevated (sudo why-slow)"
        - "Inside Docker / Container"
        - "Kubernetes DaemonSet"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact Command Executed
      description: What exact command flags did you run?
      placeholder: "why-slow --interval 3s --top 10"
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Current Behavior / Output
      description: What happened? Please paste terminal cards, panic traces, or unexpected outputs here.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
      placeholder: |
        1. Run stress workload ...
        2. Execute why-slow ...
        3. Observe false positive or error ...
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Submission Verification
      options:
        - label: I verified that the problem persists on the latest release of `why-slow`.
          required: true
        - label: I checked existing GitHub issues to ensure this is not a duplicate.
          required: true
