name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  vet:
    name: Code Quality & Vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "1.22", "1.23", "1.24" ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Verify Go Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./cmd/... ./internal/...

  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "1.22", "1.23", "1.24" ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Run Exhaustive Tests with Race Detector
        run: |
          go test -v -race -count=1 ./internal/...
          go test -v -race -count=1 ./internal_tests/battle_test.go

  build-cross:
    name: Pure Go Multi-Arch Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build linux/amd64 (Pure Go)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/why-slow-linux-amd64 ./cmd/why-slow/
          file bin/why-slow-linux-amd64

      - name: Build linux/arm64 (Pure Go)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bin/why-slow-linux-arm64 ./cmd/why-slow/
          file bin/why-slow-linux-arm64
