name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Extract Tag Version
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build linux/amd64 Static Binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ steps.tag.outputs.VERSION }}" \
            -o dist/why-slow-linux-amd64 \
            ./cmd/why-slow/

      - name: Build linux/arm64 Static Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.version=${{ steps.tag.outputs.VERSION }}" \
            -o dist/why-slow-linux-arm64 \
            ./cmd/why-slow/

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum why-slow-linux-amd64 why-slow-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/why-slow-linux-amd64
            dist/why-slow-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
